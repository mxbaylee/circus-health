name: PR71 step1 evidence repair validation
on:
  push:
    branches: [codex/pr71-step1c-validation-20261007-1728]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply hash-checked candidate without retaining this helper workflow
        env:
          PATCH_GZIP: 
        run: |
          node --input-type=module <<'NODE'
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (git('rev-parse', 'HEAD^') !== '84b582c167d07f910215750e4cde0bd26e8a8ee3') throw Error('unexpected helper parent');
          const patch = gunzipSync(Buffer.from(process.env.PATCH_GZIP, 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '514df9fc2b4f9244e3f4a30b070d70731917c49a087dc7e52b9a8d14064c811f') throw Error('patch hash');
          writeFileSync('/tmp/pr71-evidence.patch', patch);
          git('rm', '.github/workflows/pr71-step1c-validation.yml');
          git('apply', '--index', '/tmp/pr71-evidence.patch');
          if (git('write-tree') !== '20f745c6505c8b923f678a0431d6510ba98985af') throw Error('candidate tree mismatch');
          console.log('EXACT_CANDIDATE_TREE=20f745c6505c8b923f678a0431d6510ba98985af');
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: node scripts/repository-file-inventory.ts --check
      - run: git diff --cached --check
      - name: Complete affected host checks with unchanged test guards
        run: >-
          node --test --test-concurrency=2 --test-timeout=30000
          src/server/test/intake-state-*.test.ts
          src/server/test/intake-recovery-breakdown.test.ts
          src/server/test/intake-acceptance-work.test.ts
          src/server/test/intake-schema-resolution-authority.test.ts
          src/server/test/intake-schema-resolution-benefit.test.ts
          src/server/test/intake-authority-activation.test.ts
      - name: Upload only exact validated Git objects, without moving any product branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const expected = '20f745c6505c8b923f678a0431d6510ba98985af';
          if (git('write-tree') !== expected || git('diff', '--name-only')) throw Error('validated tree changed');
          const repository = 'mxbaylee/circus-health';
          if (process.env.GITHUB_REPOSITORY !== repository || process.env.GITHUB_REF !== 'refs/heads/codex/pr71-step1c-validation-20261007-1728') throw Error('unexpected helper scope');
          async function post(path, body) {
            const response = await fetch('https://api.github.com/repos/' + repository + path, {
              method: 'POST', headers: { Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
            if (!response.ok) throw Error('Git object publication failed: ' + response.status);
            return response.json();
          }
          const paths = [
            'docs/data/intake-state-storage.md', 'docs/setup/release-updates.md',
            'src/server/intake-state-evidence.ts', 'src/server/intake-state-graph.ts',
            'src/server/test/intake-recovery-breakdown.test.ts', 'src/server/test/intake-state-codec.test.ts',
          ];
          const tree = [];
          for (const path of paths) {
            const blob = await post('/git/blobs', { content: readFileSync(path, 'utf8'), encoding: 'utf-8' });
            if (blob.sha !== git('hash-object', path)) throw Error('uploaded blob mismatch: ' + path);
            tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const result = await post('/git/trees', { base_tree: 'ee076750ebad5052ab4e491d5cfcac7828b537fb', tree });
          if (result.sha !== expected) throw Error('uploaded tree mismatch');
          console.log('VALIDATED_REMOTE_TREE=' + result.sha);
          console.log('Product branch unchanged; publication requires a separate expected-SHA update.');
          NODE
