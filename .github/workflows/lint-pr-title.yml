name: 🧹 Lint PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-emoji:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No repository checkout: neither PR code nor repository install scripts run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check the proposed squash-commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-title"
          cd "$RUNNER_TEMP/pr-title"
          npm install --ignore-scripts --no-audit --no-fund --save-exact gitmojis@3.15.0
          node --input-type=module <<'NODE'
          import { gitmojis } from 'gitmojis';
          // Same rule as src/scripts/emoji-title.ts, without executing PR code.
          // The catalog is only for backward-compatible shortcodes.
          const leadingEmoji = new RegExp('^\\p{RGI_Emoji} ', 'v');
          function validEmojiTitle(title) {
            if (/[\r\n]/.test(title)) return false;
            const prefix = leadingEmoji.exec(title)?.[0];
            if (prefix) return title.slice(prefix.length).trim().length > 0;
            return gitmojis.some(
              ({ code }) => title.startsWith(`${code} `) && title.slice(code.length + 1).trim().length > 0,
            );
          }
          const title = process.env.PR_TITLE ?? '';
          if (!validEmojiTitle(title)) {
            console.error('PR title must begin with an emoji (or Gitmoji shortcode), a space and a description, e.g. 📚 Update docs or :memo: Update docs.');
            process.exitCode = 1;
          }
          NODE
