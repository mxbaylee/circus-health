name: 🧪 Guided checker focused validation

on:
  push:
    branches: [codex/crs-236-guided-abc]
    paths: [.github/workflows/guided-abc-focused.yml]

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'mxbaylee/circus-health' && github.ref == 'refs/heads/codex/crs-236-guided-abc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run only the actual guided browser test
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=60000 src/tests/browser/passkey-checker-guided.test.ts 2>&1 | tee "$RUNNER_TEMP/guided-browser.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: guided-browser-diagnostics
          path: ${{ runner.temp }}/guided-browser.log
          retention-days: 1
          if-no-files-found: error
