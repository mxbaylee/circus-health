name: 🧪 Guided checker branch preparation

on:
  push:
    branches: [codex/crs-236-guided-abc]
    paths:
      - .github/workflows/guided-abc-preparation.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'mxbaylee/circus-health' && github.ref == 'refs/heads/codex/crs-236-guided-abc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply the fingerprinted source patch
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const names = ['1', '2', '3a', '3b', '3c'];
          let encoded = names.map(name => readFileSync(`.github/guided-abc-part-${name}.b64`, 'utf8').trim()).join('');
          // Correct the single independently identified transport transcription before hashing.
          encoded = encoded.replace('Nr0dvTo8dvMK', 'Nr0dvTo8+vMK');
          const patch = gunzipSync(Buffer.from(encoded, 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '5507ef0aa1aea642a5ad8476b4bb6b390ea7b9f9ffce45dd968996e9db2f4dc3') throw Error('Source patch fingerprint mismatch');
          writeFileSync(`${process.env.RUNNER_TEMP}/guided-abc.patch`, patch);
          NODE
          git apply --check "$RUNNER_TEMP/guided-abc.patch"
          git apply "$RUNNER_TEMP/guided-abc.patch"
          rm .github/guided-abc-part-*.b64
      - run: npm ci
      - name: Format with the pinned repository toolchain
        run: npm run format
      - name: Commit only the requested checker source on the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = new Set([
            'src/app/passkey-checker/App.tsx', 'src/app/passkey-checker/GuidedApp.tsx',
            'src/app/passkey-checker/RoundApp.tsx', 'src/app/passkey-checker/checker.css',
            'src/app/passkey-checker/controller.ts', 'src/app/passkey-checker/core.ts',
            'src/app/passkey-checker/diagnostics.ts', 'src/app/passkey-checker/guided.ts',
            'src/app/passkey-checker/report.ts', 'src/app/passkey-checker/round.ts',
            'src/app/passkey-checker/store.ts', 'src/app/passkey-checker/types.ts',
            'src/tests/browser/passkey-checker-guided.test.ts',
            'src/tests/fixtures/passkey-checker-guided-browser.tsx',
            'src/tests/fixtures/passkey-checker-guided.ts',
            'src/tests/mounted/passkey-checker-guided.test.tsx',
            'src/tests/mounted/passkey-checker-round.test.tsx',
            'src/tests/passkey-checker-guided.test.ts',
            'docs/security/hosted-passkey-guided-flow.md',
            'docs/security/hosted-passkey-checker.md',
            'docs/setup/release-updates.md', 'docs/todo/CRS-236.md',
            ...['1', '2', '3a', '3b', '3c'].map(name => `.github/guided-abc-part-${name}.b64`),
          ]);
          const git = args => execFileSync('git', args, { encoding: 'utf8' });
          const paths = [...git(['diff', '--name-only', '-z']).split('\0'), ...git(['ls-files', '--others', '--exclude-standard', '-z']).split('\0')].filter(Boolean);
          for (const path of paths) if (!allowed.has(path)) throw Error(`Unexpected changed path: ${path}`);
          git(['add', '--', ...paths]);
          git(['config', 'user.name', 'github-actions[bot]']);
          git(['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
          git(['commit', '-m', '🧭 Guide hosted A/B/C checks and preserve diagnostic evidence']);
          NODE
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git push origin HEAD:refs/heads/codex/crs-236-guided-abc
      - name: Retain the public source and pinned formatter for validation
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/guided-source-tools.tgz" src/app/passkey-checker src/tests/fixtures/passkey-checker-guided* src/tests/mounted/passkey-checker* src/tests/browser/passkey-checker* src/tests/passkey-checker* docs/security/hosted-passkey* docs/setup/release-updates.md docs/todo/CRS-236.md package.json .prettierrc.json node_modules/prettier node_modules/typescript node_modules/@types
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: guided-source-tools
          path: ${{ runner.temp }}/guided-source-tools.tgz
          retention-days: 1
          if-no-files-found: error
      - run: npm run typecheck
      - run: node --test src/tests/passkey-checker-*.test.ts
      - run: npm run test:ui -- src/tests/mounted/passkey-checker-guided.test.tsx src/tests/mounted/passkey-checker-round.test.tsx
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 --test-timeout=60000 src/tests/browser/passkey-checker-guided.test.ts src/tests/browser/passkey-checker-round.test.ts
