name: 🧙🏼 Code checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: always()
    needs: [unit, components, server, continuation, browser, brand-assets, proxy-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation lane to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.JOB_RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/repository-file-inventory.ts --check
      - run: npm run typecheck
      - run: node --test src/scripts/passkey-checker-build/*.test.ts
      - run: npm run build:passkey-checker
      - name: Install PDF dependency for benchmark tooling tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - run: npm run test:deploy
      - run: npm run test:tools
      - run: npm run test:state

  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:ui

  server:
    name: Server (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Includes real encrypted recovery of a 5,001-file collection; keep this
    # qualification in the required suite rather than skipping it for cost.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install PDF and source-capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf tesseract-ocr tesseract-ocr-eng
      - name: Install the PDF renderer used by real export tests
        run: npx playwright install --with-deps chromium
      - name: Server tests with isolated fictional fixtures
        run: npm run test:server -- --test-shard=${{ matrix.shard }}/4

  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install scoped PDF extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Controlled 100-page automatic continuation
        run: npm run test:continuation

  browser:
    name: Browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install scoped PDF extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - run: npm run build:assets
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys with scripted third-party boundaries
        run: npm run test:browser:run -- --test-shard=${{ matrix.shard }}/3

  brand-assets:
    name: Brand assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node -p '`${process.platform}/${process.arch} ${process.version}`'
      - run: npm ci
      # Check committed bytes before running tests; never regenerate away stale files.
      - run: npm run brand:check
      - run: node --test src/tests/brand-assets.test.ts

  proxy-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build the pinned proxy compatibility patch
        run: docker build --tag circus-proxy-test deploy/litellm
      - name: Offline response, native PDF and diagnostics regressions
        run: >-
          docker run --rm --network none --entrypoint python
          -e LITELLM_LOCAL_MODEL_COST_MAP=True
          --mount type=bind,source="${{ github.workspace }}/deploy",target=/workspace/deploy,readonly
          --workdir /workspace/deploy/litellm
          circus-proxy-test -m unittest test_chatgpt_stream_semantics test_native_pdf test_response_diagnostics test_configure test_chatgpt_login test_oauth_qualification
