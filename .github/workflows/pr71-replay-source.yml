name: PR 71 replay checkpoint validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.repository == 'mxbaylee/circus-health' &&
      github.event.pull_request.number == 71 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/crs-231-paged-package-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3c8086670027e0e53cf24025262eb2bcf6f2a814
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Apply the exact locally tested replay patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = 3c8086670027e0e53cf24025262eb2bcf6f2a814
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sha = '1ea42486d77a683ceb19fb6769b9a0464fec0b0b';
          const response = await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/blobs/' + sha, {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
          });
          assert.equal(response.status, 200);
          const blob = await response.json();
          assert.equal(blob.encoding, 'base64');
          const wire = Buffer.from(blob.content, 'base64');
          assert.equal(createHash('sha1').update('blob ' + wire.length + '\0').update(wire).digest('hex'), sha);
          const patch = gunzipSync(Buffer.from(wire.toString('utf8'), 'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'), '96093cede700db832c0b3cebfed5c0b0ec6e257bbafb474a6d16aa168062a432');
          const path = process.env.RUNNER_TEMP + '/replay.patch';
          writeFileSync(path, patch);
          execFileSync('git', ['apply', '--check', path]);
          execFileSync('git', ['apply', path]);
          const files = {
            'docs/data/record-version-storage.md': 'f8f13903998c13cbdde73d7887e6a342d094d15f',
            'src/server/record-versions.ts': '097bcf944aa3644752c88e15f4e0a2f71d905c4e',
            'src/server/test/record-replay-sql.test.ts': 'b996c0e664acb6fb1ef10f59c8d137af258ba94f',
          };
          for (const [path, sha] of Object.entries(files)) assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), sha, path);
          execFileSync('git', ['add', '--', ...Object.keys(files)]);
          assert.deepEqual(execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim().split('\n'), Object.keys(files));
          assert.equal(execFileSync('git', ['write-tree'], { encoding: 'utf8' }).trim(), 'f6605a947d914a3e6502795f4d7d88bab06afdba');
          writeFileSync(process.env.RUNNER_TEMP + '/replay-files.json', JSON.stringify(files));
          NODE
          git diff --cached --check
          npx --no-install prettier --check docs/data/record-version-storage.md src/server/record-versions.ts src/server/test/record-replay-sql.test.ts
      - run: npm run typecheck
      - run: node scripts/repository-file-inventory.ts --check
      - name: Complete focused replay and recovery regressions
        run: |
          node --test --test-concurrency=1 \
            src/server/test/record-replay-sql.test.ts \
            src/server/test/record-versions.test.ts \
            src/server/test/record-status-read-reuse.test.ts \
            src/server/test/intake-recovery-breakdown.test.ts \
            src/server/test/profile-recovery-diagnostics.test.ts \
            src/server/test/intake-state-production-recovery.test.ts
      - name: Publish verified source objects, never advance a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const files = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/replay-files.json', 'utf8'));
          async function publish(path, body) {
            const response = await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/' + path, {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            assert.ok(response.ok, 'Git object publication status ' + response.status);
            return response.json();
          }
          const tree = [];
          for (const [path, expected] of Object.entries(files)) {
            const blob = await publish('blobs', { content: readFileSync(path, 'utf8'), encoding: 'utf-8' });
            assert.equal(blob.sha, expected, path);
            tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const result = await publish('trees', { base_tree: 'bd68ec8f7f3325d9532e0305aa91fac133788448', tree });
          assert.equal(result.sha, 'f6605a947d914a3e6502795f4d7d88bab06afdba');
          console.log('VERIFIED_REPLAY_TREE ' + JSON.stringify({ tree: result.sha, files }));
          NODE
