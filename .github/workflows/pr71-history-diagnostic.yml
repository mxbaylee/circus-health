name: PR 71 bounded history diagnosis

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths:
      - .github/workflows/pr71-history-diagnostic.yml
      - src/server/test/intake-history-publication.test.ts

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
      CRS_HISTORY_CHECKPOINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: |
          mkdir -p "$RUNNER_TEMP/pr71-cpu-prof"
          node --cpu-prof --cpu-prof-dir="$RUNNER_TEMP/pr71-cpu-prof" --test src/server/test/intake-history-publication.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr71-history-cpu-profile
          path: ${{ runner.temp }}/pr71-cpu-prof/*.cpuprofile
          if-no-files-found: ignore
          retention-days: 3
