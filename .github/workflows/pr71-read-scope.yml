name: PR 71 scoped schema read validation

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths: [.github/workflows/pr71-read-scope.yml]

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'mxbaylee/circus-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    env:
      HUSKY: 0
      TARGET_BRANCH: codex/crs-231-paged-package-authority
      MAIN_SHA: b8a5a01413042a097960e16b6412692531b1b3e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Recover the exact inspected regression and candidate scripts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const text = execFileSync('git', ['show', '38dbd4711bce8cc780c02dbc9b5c24e560106259:.github/workflows/pr71-read-scope.yml'], { encoding: 'utf8' });
          function extract(name, output) {
            const marker = '      - name: ' + name + '\n';
            assert.equal(text.split(marker).length, 2);
            const step = text.split(marker)[1].split('\n      - ')[0];
            const run = step.split('        run: |\n')[1];
            assert.ok(run);
            const script = [];
            for (const line of run.split('\n')) {
              if (line.trim() && !line.startsWith('          ')) break;
              script.push(line.slice(10));
            }
            assert.ok(script.length > 2);
            writeFileSync(join(process.env.RUNNER_TEMP, output), script.join('\n') + '\n');
          }
          extract('Add regressions against the exact inspected source', 'regressions.sh');
          extract('Prove the counted-work regression fails before the product change', 'baseline.sh');
          extract('Apply fixed synchronous schema scope reuse and observable test progress', 'candidate.sh');
          NODE
          bash -e "$RUNNER_TEMP/regressions.sh"
          bash -e "$RUNNER_TEMP/baseline.sh"
          bash -e "$RUNNER_TEMP/candidate.sh"
      - name: Preserve exact lexical oracle and derive the reduced readiness count
        run: |
          test "$(git hash-object src/server/test/intake-collection-envelope.test.ts)" = 024304bacb1df3ee3789f106a1395d0dc3521901
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const replace = (path, before, after) => {
            const text = readFileSync(path, 'utf8');
            assert.equal(text.split(before).length, 2, 'exact unique patch anchor: ' + path);
            writeFileSync(path, text.replace(before, after));
          };
          replace('src/server/test/intake-collection-envelope.test.ts',
            "    // Owned schema resolution adds entry/collection/final readiness around each\n    // of 57 headers per inspection: two more checks than the former header get.\n    // Two inspections therefore retain 1506 + 2 * 57 * 2 physical observations.\n    assert.equal(heads - headBefore, 1734, 'physical accepted HEAD includes schema owner guards');",
            "    // Owned schema resolution keeps entry/final physical readiness around each\n    // of 57 headers per inspection, sharing the inner collection proof. That is\n    // one extra observation over the former header get, not the previous two.\n    // Two inspections therefore retain 1506 + 1 * 57 * 2 = 1620 observations.\n    assert.equal(heads - headBefore, 1620, 'physical accepted HEAD includes both schema owner guards');");
          replace('docs/data/intake-state-storage.md',
            'Before scoped cold resolution, the eight-record lexical-field fixture counted 1,734 physical accepted-head reads\nover two warm inspections, compared with 1,506 before owned schema resolution.\nIn that historical measurement each inspection resolved 57 headers; resolver entry, collection selection and\nfinal readiness replace one former header-read observation with three, adding\n228 observations overall. Prepared-statement reuse leaves this count unchanged.\nKeep this added authority-check work separate from reductions in native node\nreads and bytes; it is not a net-work or latency improvement.',
            'The eight-record lexical-field fixture now counts 1,620 physical accepted-head\nreads over two warm inspections, down from 1,734 before scoped resolution, and\ncompared with 1,506 before owned schema resolution. Each inspection resolves 57\nheaders: entry and final readiness remain, while the inner collection selection\nshares the enclosing proof. Removing one redundant observation for each of\n114 resolutions accounts for the exact reduction. Both original lexical\ninspections and their complete output assertions remain. These counts still\nexceed the pre-owner baseline and do not establish whole-workflow improvement.');
          NODE
      - name: Format and typecheck the exact candidate
        run: |
          npx prettier --write src/server/intake-state-collections.ts src/server/test/intake-schema-resolution-authority.test.ts src/server/test/intake-collection-envelope.test.ts src/scripts/provider-qualification-acceptance.test.ts docs/data/intake-state-storage.md
          npm run typecheck
      - name: Run all complete schema and collection authority regression files
        run: |
          node --test --test-concurrency=1 src/server/test/intake-schema-resolution-authority.test.ts src/server/test/intake-schema-resolution-benefit.test.ts src/server/test/intake-state-read-cache-authority.test.ts src/server/test/intake-collection-envelope.test.ts
      - name: Remove temporary workflow and verify the bounded change
        run: |
          rm .github/workflows/pr71-read-scope.yml
          npx prettier --check src/server/intake-state-collections.ts src/server/test/intake-schema-resolution-authority.test.ts src/server/test/intake-collection-envelope.test.ts src/scripts/provider-qualification-acceptance.test.ts docs/data/intake-state-storage.md
          git diff --check
          git diff --stat
      - name: Publish only after passing tests and matching the current branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          current="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          current_main="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$MAIN_SHA"
          git config user.name 'Baylee Schmeisser'
          git config user.email '119542904+mxbaylee@users.noreply.github.com'
          git add src/server/intake-state-collections.ts src/server/test/intake-schema-resolution-authority.test.ts src/server/test/intake-collection-envelope.test.ts src/scripts/provider-qualification-acceptance.test.ts docs/data/intake-state-storage.md .github/workflows/pr71-read-scope.yml
          git commit -m '⚡ Share sealed schema reads and expose acceptance progress'
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  complete-oracles:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [continuation, acceptance]
    name: Step 1 complete ${{ matrix.suite }}
    env:
      HUSKY: 0
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes qpdf
      - name: Run the entire original scenario and all its assertions
        run: npm run "test:$SUITE"
