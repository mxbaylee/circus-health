name: PR 71 step 1 diagnostic

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths: [.github/workflows/pr71-step1.yml]

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'mxbaylee/circus-health'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    env:
      HUSKY: '0'
      TARGET_BRANCH: codex/crs-231-paged-package-authority
      MAIN_SHA: b8a5a01413042a097960e16b6412692531b1b3e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Recover the pinned candidate script and correct its documentation quoting
        run: |
          git show 06458eccf01b8f4ed77f93059f974cdfe4eebe36:.github/workflows/pr71-step1.yml > "$RUNNER_TEMP/candidate-source.yml"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const text = readFileSync(join(process.env.RUNNER_TEMP, 'candidate-source.yml'), 'utf8');
          const marker = "          node --input-type=module <<'NODE'\n";
          assert.equal(text.split(marker).length, 2);
          const start = text.indexOf(marker) + marker.length;
          const end = text.indexOf('\n          NODE', start);
          assert(end > start);
          let script = text.slice(start, end).split('\n').map(line => {
            assert(line.startsWith('          ') || !line);
            return line.slice(10);
          }).join('\n');
          const escapedTick = String.fromCharCode(92, 92, 96);
          const before = 'WAL connections use ' + escapedTick + 'synchronous=NORMAL' + escapedTick + '.';
          assert.equal(script.split(before).length, 2);
          script = script.replace(before, 'WAL connections use synchronous=NORMAL.');
          writeFileSync(join(process.env.RUNNER_TEMP, 'candidate.mjs'), script);
          NODE
          node --check "$RUNNER_TEMP/candidate.mjs"
          node "$RUNNER_TEMP/candidate.mjs"
      - name: Format the bounded candidate and inspect the product diff
        run: |
          npx --no-install prettier --config .prettierrc.json --write src/server/record-versions.ts src/server/test/record-versions.test.ts docs/data/record-version-storage.md docs/setup/release-updates.md
          git diff --check
          git diff --stat
          git diff -- src/server/record-versions.ts
      - run: npm run typecheck
      - name: Run complete record-version fault, history and recovery regressions
        run: node --test --test-concurrency=1 --test-timeout=600000 src/server/test/record-versions.test.ts
      - name: Remove the temporary workflow and verify formatting and inventory
        run: |
          git rm .github/workflows/pr71-step1.yml
          npm run format:check
          node scripts/repository-file-inventory.ts --check
      - name: Publish the candidate to this PR only with a concurrent-head guard
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          git add src/server/record-versions.ts src/server/test/record-versions.test.ts docs/data/record-version-storage.md docs/setup/release-updates.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '⚡ Avoid redundant cache sync and per-row scratch commits under accepted authority'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  focused:
    needs: candidate
    name: Step 1 unchanged ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [continuation, acceptance]
    env:
      HUSKY: '0'
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Execute the full original suite without diagnostic overhead
        run: npm run "test:$SUITE"
