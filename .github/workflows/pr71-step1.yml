name: PR 71 step 1 diagnostic

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths: [.github/workflows/pr71-step1.yml]

permissions:
  contents: read

jobs:
  sample:
    if: github.repository == 'mxbaylee/circus-health'
    name: SQL diagnostic ${{ matrix.suite }} - not qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [continuation, acceptance]
    env:
      HUSKY: '0'
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Locate the prior failing scenarios and inspect the reported dependency alert
        run: |
          git grep -nE 'two uploaded originals run sequentially|Stop, reload, and explicit resume retry|superseded-only receipt history|all per-record issue witnesses|same-token warning changes|owned native manual_report_label|many retained questions keep' -- src/server/test || true
          npm audit --omit=dev || true
      - name: Collect bounded diagnostic-only SQL work counts
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sql-sample.mjs" <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { performance } from 'node:perf_hooks';
          const rows = new Map(), labels = new WeakMap();
          const normalized = sql => String(sql).replace(/'(?:''|[^'])*'/g, '?').replace(/\s+/g, ' ').slice(0,500);
          function record(label, operation) {
            if (!rows.has(label) && rows.size >= 1024) label = 'other';
            let row = rows.get(label);
            if (!row) rows.set(label, row = {count:0,ms:0,max:0});
            const start = performance.now();
            try { return operation(); }
            finally { const elapsed=performance.now()-start; row.count++; row.ms+=elapsed; row.max=Math.max(row.max,elapsed); }
          }
          const probe = new DatabaseSync(':memory:');
          const statementPrototype = Object.getPrototypeOf(probe.prepare('SELECT 1'));
          probe.close();
          const prepare = DatabaseSync.prototype.prepare;
          DatabaseSync.prototype.prepare = function(sql,...args) {
            const label=normalized(sql);
            const statement=record('prepare '+label,()=>prepare.call(this,sql,...args));
            labels.set(statement,label);
            return statement;
          };
          const exec=DatabaseSync.prototype.exec;
          DatabaseSync.prototype.exec=function(sql,...args) {
            return record('exec '+normalized(sql),()=>exec.call(this,sql,...args));
          };
          for (const method of ['run','get','all']) {
            const original=statementPrototype[method];
            statementPrototype[method]=function(...args) {
              return record(method+' '+(labels.get(this)||'unknown'),()=>original.apply(this,args));
            };
          }
          setTimeout(() => {
            console.log('DIAGNOSTIC SQL COUNTS; instrumentation overhead included; NOT A TEST PASS');
            for (const order of ['ms','count']) {
              console.log('ORDER',order);
              console.log([...rows].sort((a,b)=>b[1][order]-a[1][order]).slice(0,18).map(([sql,r])=>JSON.stringify({sql,...r})).join('\n'));
            }
          },90000).unref();
          NODE
          set +e
          timeout --signal=TERM --kill-after=10s 105s npm run "test:$SUITE" -- --import="$RUNNER_TEMP/sql-sample.mjs"
          status=$?
          set -e
          echo "Diagnostic exit=$status; this deliberate interruption is not qualification."
          test "$status" -eq 124 -o "$status" -eq 0 -o "$status" -eq 1
