name: PR 71 step 1 diagnostic

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths: [.github/workflows/pr71-step1.yml]

permissions:
  contents: read
  checks: read

jobs:
  inventory:
    if: github.repository == 'mxbaylee/circus-health'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact prior failures and candidate read helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = [111629611510,111629611364,111629611504,111629611433,111629611519,111629611463,111629611383,111629611300,111629611377];
          for (const job of jobs) {
            const response = await fetch(`https://api.github.com/repos/mxbaylee/circus-health/check-runs/${job}/annotations?per_page=100`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
            console.log('CHECK', job, response.status);
            if (!response.ok) continue;
            for (const a of await response.json()) console.log(JSON.stringify({path:a.path,line:a.start_line,title:a.title,message:a.message}));
          }
          NODE
          echo '=== selected authority helpers ==='
          git grep -n 'read certificate\|readCertificate\|check.*Authority\|physicalHead' -- src/server/intake-collection* src/server/intake-state* | head -100 || true

  sample:
    if: github.repository == 'mxbaylee/circus-health'
    name: Partial cost sample ${{ matrix.suite }} - not qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [continuation, acceptance]
    env:
      HUSKY: '0'
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Sample the unmodified oracle before deliberately stopping the diagnostic
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sample.mjs" <<'NODE'
          import { Session } from 'node:inspector';
          const session = new Session();
          session.connect();
          session.post('Profiler.enable');
          session.post('Profiler.setSamplingInterval', {interval:10000});
          session.post('Profiler.start');
          setTimeout(() => session.post('Profiler.stop', (error, result) => {
            if (error) throw error;
            const p = result.profile;
            const nodes = new Map(p.nodes.map(n=>[n.id,n]));
            const parent = new Map();
            for (const n of p.nodes) for (const c of n.children || []) parent.set(c,n.id);
            const self = new Map(), inclusive = new Map();
            const key = id => { const f=nodes.get(id).callFrame; return `${f.functionName || '(anonymous)'} ${f.url.replace(process.cwd(),'')}:${f.lineNumber+1}`; };
            for (let i=0;i<(p.samples||[]).length;i++) {
              let id=p.samples[i]; const d=(p.timeDeltas[i]||0)/1000; const k=key(id);
              self.set(k,(self.get(k)||0)+d); const seen=new Set();
              while(id) {const k=key(id); if(!seen.has(k)) inclusive.set(k,(inclusive.get(k)||0)+d); seen.add(k); id=parent.get(id);}
            }
            console.log('PARTIAL CPU SAMPLE, NOT A TEST PASS', process.pid);
            for (const [label,data] of [['SELF',self],['INCLUSIVE',inclusive]]) {
              console.log(label); console.log([...data].sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>`${Math.round(v)}ms ${k}`).join('\n'));
            }
            session.disconnect();
          }), 90000).unref();
          NODE
          set +e
          timeout --signal=TERM --kill-after=10s 105s npm run "test:$SUITE" -- --import="$RUNNER_TEMP/sample.mjs"
          status=$?
          set -e
          echo "Diagnostic exit=$status; deliberately bounded sample, not a passing validation receipt."
          test "$status" -eq 124 -o "$status" -eq 0 -o "$status" -eq 1
