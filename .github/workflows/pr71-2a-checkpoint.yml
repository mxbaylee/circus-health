name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OUTPUT: /tmp/pr71-step3-published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 51e356cc33bfaae265fb4389ed9a3cfb85d15537
          persist-credentials: false
          fetch-depth: 5
      - name: Preserve pinned source and available evidence without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT/logs" "$OUTPUT/commits"
          test "$(git rev-parse HEAD)" = 51e356cc33bfaae265fb4389ed9a3cfb85d15537
          test "$(git rev-parse HEAD^{tree})" = e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          git cat-file -p HEAD > "$OUTPUT/source-commit.txt"
          git archive HEAD | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r HEAD > "$OUTPUT/source-tree.txt"
          for SHA in 51e356cc33bfaae265fb4389ed9a3cfb85d15537 25a86bb9c3ddb5516747561df56d879b08727077 1808014ab21bb558c0fd4203402ac0ae05810b98 fcfc73f3bc0ec2262027d62a7e1faf8b1db15315 6091456889e59ea77757f30c81fe0c3f879c7abb; do git cat-file -p "$SHA" > "$OUTPUT/commits/$SHA.txt"; done
          git diff 6091456889e59ea77757f30c81fe0c3f879c7abb HEAD > "$OUTPUT/published-changes.patch"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const root=process.env.OUTPUT,api='https://api.github.com/repos/mxbaylee/circus-health';
          async function get(path,file,json=true){
            const r=await fetch(api+path,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
            const text=await r.text();writeFileSync(`${root}/${file}`,text);assert.ok(r.ok,`${path}: HTTP ${r.status}`);return json?JSON.parse(text):text;
          }
          const run=await get('/actions/runs/37739859601','run.json');assert.equal(run.head_sha,'51e356cc33bfaae265fb4389ed9a3cfb85d15537');
          const jobs=await get('/actions/runs/37739859601/attempts/1/jobs?per_page=100','jobs.json');assert.equal(jobs.total_count,jobs.jobs.length);
          await get('/pulls/71','pr.json');
          await get('/issues/71/comments?since=2026-10-08T06%3A07%3A00Z&per_page=100','review-comments.json');
          await get('/pulls/71/reviews?per_page=100','reviews.json');
          await get('/pulls/71/comments?since=2026-10-08T06%3A07%3A00Z&per_page=100','review-inline-comments.json');
          await get('/git/ref/heads/codex/pr71-step3-witness-wip','witness-ref.json');
          const summaries=[];
          for(const job of jobs.jobs){
            if(job.status!=='completed')continue;
            if(job.conclusion==='success'&&!['history','acceptance','continuation'].includes(job.name))continue;
            try{const text=await get(`/actions/jobs/${job.id}/logs`,`logs/${job.id}.log`,false);
              const lines=text.split('\n'),start=lines.findIndex(line=>line.includes('failing tests:'));
              summaries.push({id:job.id,name:job.name,status:job.status,conclusion:job.conclusion,startedAt:job.started_at,completedAt:job.completed_at,excerpt:start>=0?lines.slice(start,start+100):lines.filter(line=>/##\[error\]|ℹ tests|ℹ pass|ℹ fail|ℹ cancelled|duration_ms|native identity/.test(line))});
            }catch(error){summaries.push({id:job.id,name:job.name,captureError:String(error)});}
          }
          const counts={};for(const job of jobs.jobs){const key=job.conclusion??job.status;counts[key]=(counts[key]??0)+1;}
          const summary={observedAt:new Date().toISOString(),head:run.head_sha,runId:run.id,runStatus:run.status,runConclusion:run.conclusion,counts,gates:jobs.jobs.filter(j=>['history','acceptance','continuation'].includes(j.name)).map(({id,name,status,conclusion,started_at,completed_at})=>({id,name,status,conclusion,started_at,completed_at})),summaries};
          writeFileSync(`${root}/summary.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3-published-${{ github.run_attempt }}
          path: /tmp/pr71-step3-published
          if-no-files-found: error
          retention-days: 14
