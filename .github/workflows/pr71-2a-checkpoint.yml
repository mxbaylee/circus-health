name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OUTPUT: /tmp/pr71-step3c-receipt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9a4b2e0f6effac08fce454b246a808f03355eed1
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve exact published source immediately
        run: |
          mkdir -p "$OUTPUT/logs"
          test "$(git rev-parse HEAD)" = 9a4b2e0f6effac08fce454b246a808f03355eed1
          test "$(git rev-parse HEAD^{tree})" = 5d0d4b5adef4556377818457000697d55beb6b52
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          git cat-file -p HEAD > "$OUTPUT/source-commit.txt"
          git cat-file -p HEAD^ > "$OUTPUT/parent-commit.txt"
          git archive HEAD | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r HEAD > "$OUTPUT/source-tree.txt"
          git diff HEAD^ HEAD > "$OUTPUT/published.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr71-step3c-source-receipt
          path: /tmp/pr71-step3c-receipt
          if-no-files-found: error
          retention-days: 14
      - name: Observe the existing required run without dispatching tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {setTimeout as sleep} from 'node:timers/promises';
          const root=process.env.OUTPUT,api='https://api.github.com/repos/mxbaylee/circus-health';
          async function get(path,file,json=true){
            const response=await fetch(api+path,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
            const text=await response.text();if(file)writeFileSync(`${root}/${file}`,text);
            assert.ok(response.ok,`${path}: HTTP ${response.status}`);return json?JSON.parse(text):text;
          }
          await get('/pulls/71','pr-at-start.json');
          await get('/git/ref/heads/codex/pr71-step3-safety-20261008','safety-ref.json');
          await get('/git/ref/heads/codex/pr71-step3-witness-wip','witness-ref.json');
          await get('/issues/comments/6063003743','preservation-comment.json');
          await get('/issues/comments/6063465224','bounded-review-request.json');
          await get('/issues/comments/6063504616','bounded-review-result.json');
          const observations=[];
          let jobs,run;
          for(let attempt=0;attempt<15;attempt++){
            run=await get('/actions/runs/37802077446','run.json');assert.equal(run.head_sha,'9a4b2e0f6effac08fce454b246a808f03355eed1');
            jobs=await get('/actions/runs/37802077446/attempts/1/jobs?per_page=100','jobs.json');assert.equal(jobs.total_count,jobs.jobs.length);
            const gates=jobs.jobs.filter(job=>['history','acceptance','continuation','checks'].includes(job.name)).map(({id,name,status,conclusion})=>({id,name,status,conclusion}));
            observations.push({observedAt:new Date().toISOString(),runStatus:run.status,gates});writeFileSync(`${root}/observations.json`,JSON.stringify(observations,null,2));
            if(run.status==='completed'||attempt===14)break;
            await sleep(60000);
          }
          await get('/pulls/71','pr-at-end.json');
          const summaries=[];
          for(const job of jobs.jobs){
            if(job.status!=='completed')continue;
            if(job.conclusion==='success'&&!['history','acceptance','continuation','Browser (1/6)','Browser (2/6)','Browser (5/6)','checks'].includes(job.name))continue;
            try{
              const text=await get(`/actions/jobs/${job.id}/logs`,`logs/${job.id}.log`,false);
              const lines=text.split('\n'),start=lines.findIndex(line=>line.includes('failing tests:'));
              summaries.push({id:job.id,name:job.name,conclusion:job.conclusion,startedAt:job.started_at,completedAt:job.completed_at,excerpt:start>=0?lines.slice(start,start+90):lines.filter(line=>/##\[error\]|ℹ tests|ℹ pass|ℹ fail|ℹ cancelled|ℹ skipped|duration_ms|retained proposal artifacts|superseded-only receipt|recovery stage|request finished/.test(line))});
            }catch(error){summaries.push({id:job.id,name:job.name,captureError:String(error)});}
          }
          const counts={};for(const job of jobs.jobs){const key=job.conclusion??job.status;counts[key]=(counts[key]??0)+1;}
          const summary={observedAt:new Date().toISOString(),head:run.head_sha,runId:run.id,attempt:1,runStatus:run.status,runConclusion:run.conclusion,counts,summaries};
          writeFileSync(`${root}/summary.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Hash retained evidence
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3c-ci-receipt
          path: /tmp/pr71-step3c-receipt
          if-no-files-found: error
          retention-days: 14
