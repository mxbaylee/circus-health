name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-exact257-preparation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24bd6ea680fef7500e56e5a654a5c7ed4c2558da
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Observe the original retained-artifact preparation without changing its guard
        env:
          CRS_ARTIFACT_HISTORY_PHASES: '1'
          CRS_ARTIFACT_HISTORY_DIAGNOSTICS: '1'
        run: |
          mkdir -p "$OUTPUT"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          node --test --test-concurrency=1 --test-timeout=30000 --test-reporter=spec src/server/test/intake-identity-native-artifact-history.test.ts 2>&1 | tee "$OUTPUT/original257.log"
      - name: Hash diagnostic evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-exact257-preparation
          path: /tmp/pr71-exact257-preparation
          if-no-files-found: error
          retention-days: 14
