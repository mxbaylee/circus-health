name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-progress-verified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1808014ab21bb558c0fd4203402ac0ae05810b98
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply only the checked test and documentation patch
        run: |
          mkdir -p "$OUTPUT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {inflateSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const encoded='';
          const patch=inflateSync(Buffer.from(encoded.replace('giJSZZok','giJSZok'),'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'f23347147eaf106e7d53015e74f8e39280b63cd45345ff7ec1eefbd680454139');
          const path=`${process.env.OUTPUT}/repair.patch`;writeFileSync(path,patch);
          execFileSync('git',['apply','--check',path]);execFileSync('git',['apply',path]);
          execFileSync('git',['add','docs/data/intake-bounded-views.md','src/server/test/assistant-native-progress.test.ts']);
          assert.equal(execFileSync('git',['write-tree'],{encoding:'utf8'}).trim(),'ef05a5e4330aa36aea9860d548b5919d457241d8');
          NODE
          npm ci > "$OUTPUT/npm-ci.log" 2>&1
      - name: Prove lost reuse is rejected and the exact production source passes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,openSync,closeSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {testEnvironment} from './src/scripts/test-suite.ts';
          const root=process.env.OUTPUT,file='src/server/assistant-intake-native.ts',original=readFileSync(file,'utf8');
          const start=original.indexOf('  const pendingScope = nativeAssistantScope(host),\n');
          const end=original.indexOf('    ready = resume.workflow.state',start);
          assert.ok(start>0&&end>start);
          assert.equal(original.indexOf('  const pendingScope = nativeAssistantScope(host),\n',start+1),-1);
          const replacement=['  const resume = nativeAssistantResume(host, checkpoint, mappingVersion),','    unit = nativeAssistantUnit(host),','    workUnit = unit ? { id: unit.id, locator: unit.locator?.slice(0, 2000) || unit.id } : null,',''].join('\n');
          const results=[];
          function run(name){
            const args=['--test','--test-concurrency=1','--test-reporter=spec','src/server/test/assistant-native-progress.test.ts'];
            const fd=openSync(`${root}/${name}.log`,'w'),started=new Date().toISOString();
            const r=spawnSync(process.execPath,args,{env:testEnvironment(process.env,'server'),stdio:['ignore',fd,fd]});closeSync(fd);
            results.push({name,command:[process.execPath,...args],started,finished:new Date().toISOString(),exitStatus:r.status,signal:r.signal,error:r.error?.message??null});
            writeFileSync(`${root}/test-results.json`,JSON.stringify(results,null,2));return r;
          }
          try{writeFileSync(file,original.slice(0,start)+replacement+original.slice(end));assert.equal(run('negative-no-reuse').status,1);}finally{writeFileSync(file,original);}
          const negative=readFileSync(`${root}/negative-no-reuse.log`,'utf8');
          assert.match(negative,/ℹ fail 3\b/);assert.match(negative,/ℹ cancelled 0\b/);assert.match(negative,/ℹ skipped 0\b/);
          assert.equal(readFileSync(file,'utf8'),original);
          assert.equal(run('production').status,0);
          console.log(JSON.stringify(results,null,2));
          NODE
      - name: Check types and preserve verified source without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run typecheck > "$OUTPUT/typecheck.log" 2>&1
          node node_modules/prettier/bin/prettier.cjs --check src/server/test/assistant-native-progress.test.ts > "$OUTPUT/format.log" 2>&1
          node scripts/repository-file-inventory.ts --check > "$OUTPUT/inventory.log" 2>&1
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = ef05a5e4330aa36aea9860d548b5919d457241d8
          git archive ef05a5e4330aa36aea9860d548b5919d457241d8 | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r ef05a5e4330aa36aea9860d548b5919d457241d8 > "$OUTPUT/source-tree.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const tree='ef05a5e4330aa36aea9860d548b5919d457241d8',paths=['docs/data/intake-bounded-views.md','src/server/test/assistant-native-progress.test.ts'];
          const response=await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/trees',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({base_tree:'cc699e9c0115a04973dab2dc856caf7baa43965b',tree:paths.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))}),signal:AbortSignal.timeout(60000)
          });
          const result=await response.json();assert.ok(response.ok,JSON.stringify(result));assert.equal(result.sha,tree);
          writeFileSync(`${process.env.OUTPUT}/preserved.json`,JSON.stringify({base:'1808014ab21bb558c0fd4203402ac0ae05810b98',tree,paths,refsChanged:false,node:process.version},null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-progress-verified
          path: /tmp/pr71-progress-verified
          if-no-files-found: error
          retention-days: 14
