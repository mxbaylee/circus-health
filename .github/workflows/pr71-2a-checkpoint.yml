name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      OUTPUT: /tmp/pr71-step3c-final-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9a4b2e0f6effac08fce454b246a808f03355eed1
          persist-credentials: false
          fetch-depth: 1
      - name: Capture complete final status and previously unfinished job evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT/logs"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const root=process.env.OUTPUT,api='https://api.github.com/repos/mxbaylee/circus-health';
          async function get(path,file,json=true){const response=await fetch(api+path,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});const text=await response.text();writeFileSync(`${root}/${file}`,text);assert.ok(response.ok,`${path}: HTTP ${response.status}`);return json?JSON.parse(text):text;}
          const run=await get('/actions/runs/37802077446','run.json');assert.equal(run.head_sha,'9a4b2e0f6effac08fce454b246a808f03355eed1');assert.equal(run.status,'completed');
          const jobs=await get('/actions/runs/37802077446/attempts/1/jobs?per_page=100','jobs.json');assert.equal(jobs.total_count,jobs.jobs.length);assert.ok(jobs.jobs.every(job=>job.status==='completed'));
          await get('/pulls/71','pr.json');
          const details=[];
          for(const job of jobs.jobs){
            if(!['Server (9/16)','checks'].includes(job.name))continue;
            const text=await get(`/actions/jobs/${job.id}/logs`,`logs/${job.id}.log`,false),lines=text.split('\n');
            details.push({id:job.id,name:job.name,conclusion:job.conclusion,startedAt:job.started_at,completedAt:job.completed_at,excerpt:lines.filter(line=>/##\[error\]|ℹ tests|ℹ pass|ℹ fail|ℹ cancelled|ℹ skipped|failing tests:|✖/.test(line)),tail:lines.slice(-50)});
          }
          const counts={};for(const job of jobs.jobs)counts[job.conclusion]=(counts[job.conclusion]??0)+1;
          const summary={observedAt:new Date().toISOString(),run:run.id,head:run.head_sha,status:run.status,conclusion:run.conclusion,total:jobs.total_count,counts,details};
          writeFileSync(`${root}/summary.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Hash evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3c-final-ci
          path: /tmp/pr71-step3c-final-ci
          if-no-files-found: error
          retention-days: 14
