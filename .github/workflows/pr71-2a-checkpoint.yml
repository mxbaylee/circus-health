name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OUTPUT: /tmp/pr71-step2-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: af98227c397c2c5939b5b49a13effa8e2ebf838d
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Preserve exact source identity and completed gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT/logs"
          test "$(git rev-parse HEAD)" = af98227c397c2c5939b5b49a13effa8e2ebf838d
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          git cat-file -p HEAD > "$OUTPUT/source-commit.txt"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const root = process.env.OUTPUT;
          const api = 'https://api.github.com/repos/mxbaylee/circus-health';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          async function get(path, file, json = true) {
            const response = await fetch(api + path, { headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw Error(`${path}: HTTP ${response.status}`);
            const text = await response.text();
            if (file) writeFileSync(`${root}/${file}`, text);
            return json ? JSON.parse(text) : text;
          }
          // Observe the existing run, never dispatch or re-run a test. Stop after
          // a bounded wait and retain an explicitly incomplete snapshot if needed.
          const polls = [];
          let jobs;
          for (let attempt = 0; attempt < 11; attempt++) {
            jobs = await get('/actions/runs/37715662544/attempts/1/jobs?per_page=100', 'jobs.json');
            if (jobs.total_count !== jobs.jobs.length) throw Error('Incomplete job listing');
            const gates = jobs.jobs.filter(job => ['acceptance', 'continuation'].includes(job.name));
            if (gates.length !== 2) throw Error('Missing exact gate jobs');
            polls.push({ observedAt: new Date().toISOString(), gates: gates.map(({id,name,status,conclusion}) => ({id,name,status,conclusion})) });
            writeFileSync(`${root}/gate-observations.json`, JSON.stringify(polls, null, 2));
            if (gates.every(job => job.status === 'completed') || attempt === 10) break;
            await sleep(60000);
          }
          const run = await get('/actions/runs/37715662544', 'run.json');
          if (run.head_sha !== 'af98227c397c2c5939b5b49a13effa8e2ebf838d') throw Error('Wrong candidate run');
          await get('/pulls/71', 'pr.json');
          await get('/issues/comments/6050628885', 'bounded-review-request.json');
          await get('/issues/comments/6050652895', 'bounded-review-result.json');
          const wanted = new Set(['acceptance', 'continuation', 'Server (4/16)', 'Server (6/16)', 'Browser (5/6)', 'Browser (6/6)', 'Server (8/16)', 'checks']);
          const summaries = [];
          for (const job of jobs.jobs) {
            if (job.status !== 'completed') continue;
            if (!wanted.has(job.name) && job.conclusion === 'success') continue;
            try {
              const text = await get(`/actions/jobs/${job.id}/logs`, `logs/${job.id}.log`, false);
              const lines = text.split('\n');
              const failures = lines.findIndex(line => line.includes('failing tests:'));
              summaries.push({ id:job.id, name:job.name, conclusion:job.conclusion, startedAt:job.started_at, completedAt:job.completed_at, excerpt:failures >= 0 ? lines.slice(failures,failures+65) : lines.filter(line => /duration_ms|ℹ tests|ℹ pass|ℹ fail|ℹ cancelled|##\[error\]|recovery stage/.test(line)) });
            } catch (error) { summaries.push({id:job.id,name:job.name,captureError:String(error)}); }
          }
          const counts = {};
          for (const job of jobs.jobs) {const key = job.conclusion ?? job.status; counts[key] = (counts[key] ?? 0) + 1;}
          const gates = jobs.jobs.filter(job => ['acceptance','continuation'].includes(job.name)).map(({id,name,status,conclusion,started_at,completed_at})=>({id,name,status,conclusion,started_at,completed_at}));
          const summary = {observedAt:new Date().toISOString(),runId:run.id,attempt:run.run_attempt,headSha:run.head_sha,runStatus:run.status,runConclusion:run.conclusion,counts,gates,gatesPassed:gates.every(job=>job.status==='completed' && job.conclusion==='success'),summaries};
          writeFileSync(`${root}/summary.json`,JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step2-ci-receipt
          path: /tmp/pr71-step2-ci
          if-no-files-found: error
          retention-days: 14
