name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-e476-optical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e4763406356b1a3c5ec33568d18676bc0206e695
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install scoped PDF extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - run: npm run build:assets
      - run: npx playwright install --with-deps chromium
      - name: Observe both optical mappings on pinned source
        env:
          CRS_TEST_DIAGNOSTICS: '1'
          CRS_PDF_CONTROLLED_TEST: '0'
          CRS_TEST_SCREENSHOTS: /tmp/pr71-e476-optical/screenshots
        run: |
          set -o pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          node --test --test-concurrency=1 --test-reporter=spec src/tests/browser/import-mapping-shapes.test.ts 2>&1 | tee "$OUTPUT/optical.log"
      - name: Hash diagnostic evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-e476-optical
          path: /tmp/pr71-e476-optical
          if-no-files-found: error
          retention-days: 14
