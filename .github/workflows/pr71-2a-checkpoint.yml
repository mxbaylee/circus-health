name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-step1-baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 353f8f167a7871f36e13a584da844af5265f5c7e
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare isolated contributor tools
        run: |
          mkdir -p "$OUTPUT/profiles" /tmp/pr71-step1-tools/bin
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git status --porcelain > "$OUTPUT/source-status.txt"
          npm ci > "$OUTPUT/npm-ci.log" 2>&1
          cp "$(command -v node)" /tmp/pr71-step1-tools/bin/node
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.pfb' -czf /tmp/pr71-step1-tools/dependencies.tar.gz node_modules
          sha256sum package-lock.json > /tmp/pr71-step1-tools/package-lock.sha256
          cd /tmp/pr71-step1-tools
          sha256sum bin/node dependencies.tar.gz package-lock.sha256 > SHA256SUMS
      - name: Profile only the existing eight-record host diagnostic
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { openSync, closeSync, writeFileSync } from 'node:fs';
          import { testEnvironment } from './src/scripts/test-suite.ts';
          const args = ['--cpu-prof', `--cpu-prof-dir=${process.env.OUTPUT}/profiles`, '--test', '--test-concurrency=1', '--test-name-pattern=8 records', '--test-reporter=spec', 'src/server/test/intake-acceptance-work.test.ts'];
          const fd = openSync(`${process.env.OUTPUT}/baseline.log`, 'w');
          const result = spawnSync(process.execPath, args, { env: testEnvironment(process.env, 'server'), stdio: ['ignore', fd, fd] });
          closeSync(fd);
          writeFileSync(`${process.env.OUTPUT}/result.json`, JSON.stringify({ command: ['node', ...args], node: process.version, status: result.status, signal: result.signal, error: result.error?.message ?? null, scope: 'Profiled eight-record diagnostic; not encrypted recovery qualification' }, null, 2));
          process.exitCode = result.status ?? 1;
          NODE
      - name: Hash retained diagnostic evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step1-baseline
          path: /tmp/pr71-step1-baseline
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr71-step1-offline-tools
          path: /tmp/pr71-step1-tools
          if-no-files-found: error
          retention-days: 2
