name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 25a86bb9c3ddb5516747561df56d879b08727077
          persist-credentials: false
          fetch-depth: 1
      - name: Store only checksum-verified Git blobs without changing a tree or ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 0910d84013d539698384c93f6152b1eb8fd98b5b
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {inflateSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),'25a86bb9c3ddb5516747561df56d879b08727077');
          const recipe=git('show','0910d84013d539698384c93f6152b1eb8fd98b5b:.github/workflows/pr71-2a-checkpoint.yml');
          const matches=[...recipe.matchAll(/const encoded='([^']+)';/g)];assert.equal(matches.length,1);
          const patch=inflateSync(Buffer.from(matches[0][1],'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'01c1557e4b8c5907b96a8b6f960ea4b5f9c837876376d46b4103873fbba2838c');
          writeFileSync('/tmp/history-lane.patch',patch);
          git('apply','--check','/tmp/history-lane.patch');git('apply','/tmp/history-lane.patch');git('add','-A');
          assert.equal(git('write-tree'),'e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e');
          const paths=git('diff','--cached','--name-only').split('\n');assert.equal(paths.length,6);
          const entries=[];
          for(const path of paths){
            const content=readFileSync(path),expected=git('hash-object',path);
            const response=await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:content.toString('base64'),encoding:'base64'}),signal:AbortSignal.timeout(30000)
            });
            const result=await response.json();assert.ok(response.ok,JSON.stringify(result));assert.equal(result.sha,expected);
            entries.push({path,mode:'100644',type:'blob',sha:result.sha});
          }
          console.log(JSON.stringify({tree:'e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e',baseTree:'ef05a5e4330aa36aea9860d548b5919d457241d8',entries,refsChanged:false},null,2));
          NODE
