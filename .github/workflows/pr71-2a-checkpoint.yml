name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-step3-index-sql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 51e356cc33bfaae265fb4389ed9a3cfb85d15537
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Recover checked source delta
        run: |
          mkdir -p "$OUTPUT"
          test "$(git rev-parse HEAD)" = 51e356cc33bfaae265fb4389ed9a3cfb85d15537
          git rev-parse HEAD > "$OUTPUT/base-sha.txt"
          node --input-type=module <<'NODE'
          import {gunzipSync} from 'node:zlib';
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const encoded = '';
          const patch = gunzipSync(Buffer.from(encoded,'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'1ccfd45e169acd637aa63a46b6ae68d94bae72d0aeca867991294e2de6528aa1');
          writeFileSync(`${process.env.OUTPUT}/repair.patch`,patch);
          NODE
          npm ci > "$OUTPUT/npm-ci.log" 2>&1
          git apply --check "$OUTPUT/repair.patch"
          git apply --include=src/server/test/record-replay-sql.test.ts "$OUTPUT/repair.patch"
      - name: Verify counted regressions fail before the implementation change
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {testEnvironment} from './src/scripts/test-suite.ts';
          const args=['--test','--test-concurrency=1','--test-name-pattern=publication reads fresh','--test-reporter=spec','src/server/test/record-replay-sql.test.ts'];
          const result=spawnSync(process.execPath,args,{env:testEnvironment(process.env,'server'),encoding:'utf8',maxBuffer:16*1024*1024});
          const text=result.stdout+result.stderr;
          writeFileSync(`${process.env.OUTPUT}/red.log`,text);
          writeFileSync(`${process.env.OUTPUT}/red-result.json`,JSON.stringify({args,status:result.status,signal:result.signal}));
          assert.equal(result.status,1);assert.match(text,/tests 2/);assert.match(text,/fail 2/);assert.match(text,/cancelled 0/);assert.match(text,/skipped 0/);assert.match(text,/one fresh read statement/);
          NODE
      - name: Apply the repair and verify exact candidate source
        run: |
          git apply --exclude=src/server/test/record-replay-sql.test.ts "$OUTPUT/repair.patch"
          git add docs/data/record-version-storage.md docs/setup/release-updates.md src/server/record-versions.ts src/server/test/record-replay-sql.test.ts
          test "$(git write-tree)" = 5d0d4b5adef4556377818457000697d55beb6b52
          git diff --cached --check
          git write-tree > "$OUTPUT/candidate-tree.txt"
      - name: Execute complete record, history and encrypted-profile regressions
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {openSync,closeSync,writeFileSync} from 'node:fs';
          import {testEnvironment} from './src/scripts/test-suite.ts';
          const names=['record-versions','record-history-index-growth','record-note-history','record-replay-sql','record-status-read-reuse','contributor-record-storage','encrypted-profiles'];
          const args=['--test','--test-concurrency=1','--test-reporter=spec',...names.map(n=>`src/server/test/${n}.test.ts`)];
          const fd=openSync(`${process.env.OUTPUT}/green.log`,'w');
          const result=spawnSync(process.execPath,args,{env:testEnvironment(process.env,'server'),stdio:['ignore',fd,fd]});closeSync(fd);
          writeFileSync(`${process.env.OUTPUT}/green-result.json`,JSON.stringify({args,status:result.status,signal:result.signal}));
          process.exitCode=result.status??1;
          NODE
      - name: Verify static checks
        run: |
          npm run typecheck > "$OUTPUT/typecheck.log" 2>&1
          npx prettier --check src/server/record-versions.ts src/server/test/record-replay-sql.test.ts > "$OUTPUT/format.log" 2>&1
          node scripts/repository-file-inventory.ts --check > "$OUTPUT/inventory.log" 2>&1
      - name: Store verified source blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive "$(git write-tree)" | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r "$(git write-tree)" > "$OUTPUT/source-tree.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const files=[['docs/data/record-version-storage.md','2af280885b021285fd38dc8f6ef3a22c8d51972a'],['docs/setup/release-updates.md','42d7f1e9adaa5324e60d0283ee200ddb7e7d8b01'],['src/server/record-versions.ts','a4bff35fd9f7ff741e11cb9fda97a1256d9c1504'],['src/server/test/record-replay-sql.test.ts','36d94166369ec90aa0c1f0082be8e8d422a62b1a']];
          const blobs=[];
          for(const [path,sha] of files){
            const response=await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/blobs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:readFileSync(path,'utf8'),encoding:'utf-8'})});
            const result=await response.json();assert.ok(response.ok,JSON.stringify(result));assert.equal(result.sha,sha);blobs.push({path,sha,mode:'100644',type:'blob'});
          }
          writeFileSync(`${process.env.OUTPUT}/blobs.json`,JSON.stringify(blobs,null,2));console.log(JSON.stringify(blobs));
          NODE
      - name: Hash retained evidence
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3-index-sql
          path: /tmp/pr71-step3-index-sql
          if-no-files-found: error
          retention-days: 14
