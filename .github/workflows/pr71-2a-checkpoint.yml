name: PR71 pinned artifact-history preparation diagnostic
on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]
  workflow_dispatch:

jobs:
  artifact-history-257:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      HUSKY: "0"
      CRS_ARTIFACT_HISTORY_PHASES: "1"
      CRS_ARTIFACT_HISTORY_DIAGNOSTICS: "1"
    steps:
      # Diagnostic branch only; the implementation checkout is pinned independently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: afecf9f2fc80fe219d74b05a69bfdee9a72a1477
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: source/.nvmrc
          package-manager-cache: false
      - name: Install pinned source dependencies
        working-directory: source
        run: npm ci
      - name: Run original 257-artifact fixture with aggregate preparation probe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr71-afec-history"
          git rev-parse HEAD > "$RUNNER_TEMP/pr71-afec-history/source-head.txt"
          git -C ../diagnostic rev-parse HEAD > "$RUNNER_TEMP/pr71-afec-history/diagnostic-head.txt"
          test "$(git rev-parse HEAD)" = 'afecf9f2fc80fe219d74b05a69bfdee9a72a1477'
          sha256sum src/server/test/intake-identity-native-artifact-history.test.ts src/server/intake-workflow-command.ts src/server/intake-envelope-mutation.ts src/server/intake-envelope-build.ts src/server/intake-state-collections.ts src/server/record-versions.ts src/scripts/test-suite.ts package-lock.json ../diagnostic/.github/workflows/pr71-2a-checkpoint.yml > "$RUNNER_TEMP/pr71-afec-history/source-sha.txt"
          npm run test:history -- --test-name-pattern='^native warm identity cooperates across 257 retained proposal artifacts and duplicate occurrences$' \
            2>&1 | tee "$RUNNER_TEMP/pr71-afec-history/history.log"
      - name: Checksum all available receipts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr71-afec-history"
          find "$RUNNER_TEMP/pr71-afec-history" -type f ! -name SHA256SUMS -print0 | xargs -0 -r sha256sum > "$RUNNER_TEMP/pr71-afec-history/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr71-afec-history-preparation
          path: ${{ runner.temp }}/pr71-afec-history
          if-no-files-found: error
