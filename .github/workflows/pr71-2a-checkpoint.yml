name: PR71 pinned identity history phase diagnostic
on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]
  workflow_dispatch:

jobs:
  artifact-history-257:
    if: github.ref == 'refs/heads/codex/pr71-step0-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c04f278ab338a6973d30658e7309fcbb21365b67
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: source/.nvmrc
          package-manager-cache: false
      - name: Install pinned source dependencies
        working-directory: source
        run: npm ci
      - name: Run original 257-artifact case with bounded identity phase probe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/pr71-c04-identity-history"
          mkdir -p "$receipts"
          git rev-parse HEAD > "$receipts/source-head.txt"
          git -C ../diagnostic rev-parse HEAD > "$receipts/diagnostic-head.txt"
          test "$(git rev-parse HEAD)" = 'c04f278ab338a6973d30658e7309fcbb21365b67'
          test "$(sha256sum ../diagnostic/.github/workflows/pr71-identity-phase-loader.mjs | cut -d ' ' -f 1)" = '816eae24b37b62b9d26377c2e2471507bd883b65250acd1fe283cfa5f895d80d'
          sha256sum src/server/intake-identity-native.ts src/server/clinical-review-artifact-proof.ts src/server/clinical-review-work.ts src/server/test/intake-identity-native-artifact-history.test.ts package-lock.json ../diagnostic/.github/workflows/pr71-identity-phase-loader.mjs ../diagnostic/.github/workflows/pr71-2a-checkpoint.yml > "$receipts/source-sha.txt"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" PR71_IDENTITY_SOURCE_SMOKE=1 node ../diagnostic/.github/workflows/pr71-identity-phase-loader.mjs 2>&1 | tee "$receipts/smoke.log"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CRS_ARTIFACT_HISTORY_PHASES=1 node --import ../diagnostic/.github/workflows/pr71-identity-phase-loader.mjs --test --test-name-pattern='^native warm identity cooperates across 257 retained proposal artifacts and duplicate occurrences$' src/server/test/intake-identity-native-artifact-history.test.ts 2>&1 | tee "$receipts/history.log"
      - name: Checksum all available receipts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr71-c04-identity-history"
          find "$RUNNER_TEMP/pr71-c04-identity-history" -type f ! -name SHA256SUMS -print0 | xargs -0 -r sha256sum > "$RUNNER_TEMP/pr71-c04-identity-history/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr71-c04-identity-history
          path: ${{ runner.temp }}/pr71-c04-identity-history
          if-no-files-found: error
