name: PR71 pinned optical report failure diagnostic
on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]
  workflow_dispatch:

jobs:
  optical-report-failure:
    if: github.ref == 'refs/heads/codex/pr71-step0-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 265055994c99ecc0289916a6838ce990cced76c7
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: source/.nvmrc
          package-manager-cache: false
      - name: Install pinned source dependencies
        working-directory: source
        run: npm ci
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Build assets
        working-directory: source
        run: npm run build:assets
      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Run original optical case with bounded exact-query request probe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/pr71-265-optical"
          mkdir -p "$receipts"
          git rev-parse HEAD > "$receipts/source-head.txt"
          git -C ../diagnostic rev-parse HEAD > "$receipts/diagnostic-head.txt"
          test "$(git rev-parse HEAD)" = '265055994c99ecc0289916a6838ce990cced76c7'
          test "$(sha256sum ../diagnostic/.github/workflows/pr71-optical-report-failure-loader.mjs | cut -d ' ' -f 1)" = '9aab0c21d040b345134b015dc54535053efaeab52016c806278c96a34b50fd31'
          sha256sum src/tests/browser/import-mapping-shapes.test.ts src/app/data/api.ts src/app/data/read-recovery.ts package-lock.json ../diagnostic/.github/workflows/pr71-optical-report-failure-loader.mjs ../diagnostic/.github/workflows/pr71-2a-checkpoint.yml > "$receipts/source-sha.txt"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CRS_TEST_DIAGNOSTICS=1 CRS_PDF_CONTROLLED_TEST=0 node --import ../diagnostic/.github/workflows/pr71-optical-report-failure-loader.mjs --test --test-concurrency=1 --test-reporter=spec src/tests/browser/import-mapping-shapes.test.ts 2>&1 | tee "$receipts/optical.log"
      - name: Checksum all available receipts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr71-265-optical"
          find "$RUNNER_TEMP/pr71-265-optical" -type f ! -name SHA256SUMS -print0 | xargs -0 -r sha256sum > "$RUNNER_TEMP/pr71-265-optical/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr71-265-optical
          path: ${{ runner.temp }}/pr71-265-optical
          if-no-files-found: error
