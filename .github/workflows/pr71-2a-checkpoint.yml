name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6091456889e59ea77757f30c81fe0c3f879c7abb
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and preserve earlier source tree without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { inflateSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const encoded = '';
          const patch = inflateSync(Buffer.from(encoded,'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'56c787d31ecfd2489c6fe485278bb6bcdd1e4882c8c224ad1641dc53a56b3cbc');
          const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),'6091456889e59ea77757f30c81fe0c3f879c7abb');
          writeFileSync('/tmp/witness.patch',patch);
          git('apply','--unidiff-zero','--check','/tmp/witness.patch');
          git('apply','--unidiff-zero','/tmp/witness.patch');
          git('add','-A');
          const tree = git('write-tree');
          assert.equal(tree,'061267352dbc359a4044817ad901938d17cb938f');
          const paths = git('diff','--cached','--name-only').split('\n');
          assert.equal(paths.length,5);
          const response = await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/trees',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({base_tree:'be1e57f3544eee63316b61036b378d9041927183',tree:paths.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))}),signal:AbortSignal.timeout(60000)
          });
          const result=await response.json();assert.ok(response.ok,JSON.stringify(result));assert.equal(result.sha,tree);
          console.log(JSON.stringify({preservedTree:tree,sourceCandidate:'2d1baafcde4414c8ec6b2dfdf2509d0f2acc4e2f',paths,refsChanged:false},null,2));
          NODE
