name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      OUTPUT: /tmp/pr71-published-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1808014ab21bb558c0fd4203402ac0ae05810b98
          persist-credentials: false
          fetch-depth: 3
      - name: Preserve exact source and completed WIP evidence without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT/logs"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          git cat-file -p HEAD > "$OUTPUT/source-commit.txt"
          git cat-file -p HEAD^ > "$OUTPUT/batch-commit.txt"
          git archive HEAD | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r HEAD > "$OUTPUT/source-tree.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const root=process.env.OUTPUT;
          const api='https://api.github.com/repos/mxbaylee/circus-health';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          async function get(path,file,json=true){
            const response=await fetch(api+path,{headers,signal:AbortSignal.timeout(30000)});
            const text=await response.text();writeFileSync(`${root}/${file}`,text);
            assert.ok(response.ok,`${path}: HTTP ${response.status}`);
            return json?JSON.parse(text):text;
          }
          const run=await get('/actions/runs/37735896498','batch-run.json');
          assert.equal(run.head_sha,'fcfc73f3bc0ec2262027d62a7e1faf8b1db15315');
          const jobs=await get('/actions/runs/37735896498/attempts/1/jobs?per_page=100','batch-jobs.json');
          assert.equal(jobs.total_count,jobs.jobs.length);
          const summaries=[];
          for(const job of jobs.jobs){
            if(job.status!=='completed')continue;
            if(job.conclusion==='success'&&!['acceptance','continuation','Browser (2/6)'].includes(job.name))continue;
            try {
              const text=await get(`/actions/jobs/${job.id}/logs`,`logs/${job.id}.log`,false);
              const lines=text.split('\n');const start=lines.findIndex(line=>line.includes('failing tests:'));
              summaries.push({id:job.id,name:job.name,conclusion:job.conclusion,startedAt:job.started_at,completedAt:job.completed_at,excerpt:start>=0?lines.slice(start,start+110):lines.filter(line=>/##\[error\]|ℹ tests|ℹ pass|ℹ fail|ℹ cancelled|duration_ms/.test(line))});
            }catch(error){summaries.push({id:job.id,name:job.name,captureError:String(error)});}
          }
          writeFileSync(`${root}/failure-summary.json`,JSON.stringify(summaries,null,2));
          await get('/pulls/71','pr.json');
          await get('/issues/71/comments?since=2026-10-08T06%3A07%3A00Z&per_page=100','review-comments.json');
          await get('/git/ref/heads/codex/pr71-step3-witness-wip','witness-ref.json');
          await get('/git/commits/d65e15c071e0a3bf7e111e90b4ee972a4f5ec6bb','witness-commit.json');
          await get('/actions/runs/37737310074','combined-run.json');
          await get('/actions/runs/37737310074/jobs?per_page=100','combined-jobs.json');
          console.log(JSON.stringify(summaries,null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-published-evidence
          path: /tmp/pr71-published-evidence
          if-no-files-found: error
          retention-days: 14
