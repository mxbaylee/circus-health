name: PR 71 step 2A checkpoint

on:
  push:
    branches: [codex/crs-231-paged-package-authority]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6dbd3cf81548b4d90ce68c6880370af08228f06c
          persist-credentials: false
          fetch-depth: 1
      - name: Retain exact public source and existing CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ runner.temp }}/step2a
        run: |
          mkdir -p "$OUTPUT/logs"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git ls-tree -r HEAD > "$OUTPUT/source-tree.txt"
          git archive HEAD | gzip > "$OUTPUT/source.tar.gz"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const jobs = [112925397649, 112925397543, 112925397689, 112925397619, 112925397704];
          const summary = [];
          for (const id of jobs) {
            const response = await fetch(`https://api.github.com/repos/mxbaylee/circus-health/actions/jobs/${id}/logs`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            assert.ok(response.ok, `log ${id}: ${response.status}`);
            const text = await response.text();
            writeFileSync(`${process.env.OUTPUT}/logs/${id}.log`, text);
            const lines = text.split('\n');
            const start = lines.findIndex(line => line.includes('failing tests:'));
            summary.push({ id, failures: start < 0 ? lines.filter(line => line.includes('##[error]')) : lines.slice(start, start + 75) });
          }
          writeFileSync(`${process.env.OUTPUT}/failures.json`, JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr71-step2a-source-and-logs
          path: ${{ runner.temp }}/step2a
          retention-days: 2
