name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-browser-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15036736e60cabbacdc48cc8229297373b9e0eaf
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install scoped PDF dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - run: npm run build:assets
      - run: npx playwright install --with-deps chromium
      - name: Original optical and holdout journeys with bounded diagnostics
        env:
          CRS_TEST_DIAGNOSTICS: '1'
          CRS_TEST_SCREENSHOTS: /tmp/pr71-browser-diagnostics/screenshots
        run: |
          mkdir -p "$OUTPUT/screenshots"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          node --input-type=module -e 'import {spawnSync} from "node:child_process"; import {testEnvironment} from "./src/scripts/test-suite.ts"; const r=spawnSync(process.execPath,["--test","--test-concurrency=1","--test-timeout=60000","--test-name-pattern=encrypted browser accepts both|encrypted Import holdout","src/tests/browser/import-mapping-shapes.test.ts","src/tests/browser/import-feed-holdout.test.ts"],{stdio:"inherit",env:testEnvironment(process.env,"browser")}); if(r.error)throw r.error; process.exitCode=r.status??1;' 2>&1 | tee "$OUTPUT/browser.log"
      - name: Hash diagnostic evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-browser-diagnostics
          path: /tmp/pr71-browser-diagnostics
          if-no-files-found: error
          retention-days: 14
