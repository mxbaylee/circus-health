name: PR71 bounded node codec comparison
on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]
  workflow_dispatch:

jobs:
  node-codec-32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Diagnostic branch only; never merge into the implementation branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8b1652ef567a4447851a94d1a204c5e846f4eade
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: source/.nvmrc
          package-manager-cache: false
      - name: Install pinned source dependencies
        working-directory: source
        run: npm ci
      - name: Compare bounded node representations serially
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr71-node-codec"
          git rev-parse HEAD > "$RUNNER_TEMP/pr71-node-codec/source-head.txt"
          test "$(git rev-parse HEAD)" = '8b1652ef567a4447851a94d1a204c5e846f4eade'
          sha256sum src/server/intake-state-tree.ts src/server/intake-state-graph.ts src/server/record-versions.ts src/server/test/intake-history-publication.test.ts ../diagnostic/pr71-node-codec-loader.mjs > "$RUNNER_TEMP/pr71-node-codec/source-sha.txt"
          for mode in plain compressed; do
            CRS_NODE_CODEC_DIAGNOSTIC=1 CRS_NODE_CODEC_MODE="$mode" CRS_NODE_CODEC_COUNT=32 CRS_HISTORY_WAL_CHECKPOINT_PAGES=32768 \
              node --import=../diagnostic/pr71-node-codec-loader.mjs --test --experimental-strip-types \
                --test-name-pattern='^bounded node codec comparison: 32 artifacts$' \
                src/server/test/intake-history-publication.test.ts \
                > "$RUNNER_TEMP/pr71-node-codec/$mode.log" 2>&1
          done
      - name: Checksum all available receipts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr71-node-codec"
          find "$RUNNER_TEMP/pr71-node-codec" -type f ! -name SHA256SUMS -print0 | xargs -0 -r sha256sum > "$RUNNER_TEMP/pr71-node-codec/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr71-node-codec-32
          path: ${{ runner.temp }}/pr71-node-codec
          if-no-files-found: error
