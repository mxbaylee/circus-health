name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-step3c-artifact-phases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9a4b2e0f6effac08fce454b246a808f03355eed1
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare a phase-only copy without changing the original oracle
        run: |
          mkdir -p "$OUTPUT"
          test "$(git rev-parse HEAD)" = 9a4b2e0f6effac08fce454b246a808f03355eed1
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          npm ci > "$OUTPUT/npm-ci.log" 2>&1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {createHash} from 'node:crypto';
          const originalPath=resolve('src/server/test/intake-identity-native-artifact-history.test.ts');
          const original=readFileSync(originalPath,'utf8');let text=original;
          const changes=[];
          function replace(from,to){assert.equal(text.split(from).length,2,from);text=text.replace(from,to);changes.push({from,to});}
          const marker=`const phaseStart=performance.now();let previous=phaseStart,previousCpu=process.cpuUsage(),previousWork={};
          function mark(phase,db){const now=performance.now(),cpu=process.cpuUsage(),work={...intakeWorkCounters(db).warm};console.error(JSON.stringify({diagnostic:'full original artifact history with phase observations',phase,elapsedMs:now-phaseStart,durationMs:now-previous,cpuMs:((cpu.user-previousCpu.user)+(cpu.system-previousCpu.system))/1000,maxRssKiB:process.resourceUsage().maxRSS,work:Object.fromEntries(Object.entries(work).filter(([k,v])=>v!==(previousWork[k]??0)).map(([k,v])=>[k,v-(previousWork[k]??0)]))}));previous=now;previousCpu=cpu;previousWork=work;}
          `;
          replace('async function artifactHistoryFixture(t: test.TestContext) {',marker+'async function artifactHistoryFixture(t: test.TestContext) {');
          replace('  await buildIntakeCollectionEnvelope',"  mark('seed-ready',f.db);\n  await buildIntakeCollectionEnvelope");
          replace('  const prepared = await prepareIntakeWorkflowCommand(',"  mark('preparation-start',f.db);\n  const prepared = await prepareIntakeWorkflowCommand(");
          replace("  if (prepared.replayed) throw Error('Unexpected artifact fixture replay');","  mark('prepared',f.db);\n  if (prepared.replayed) throw Error('Unexpected artifact fixture replay');");
          replace('  const cold = await f.review();',"  mark('published',f.db);\n  const cold = await f.review();\n  mark('cold-review',f.db);");
          replace('  const stable = await f.review();',"  const stable = await f.review();\n  mark('stable-review',f.db);");
          replace('  const totalBytes = Number(',"  mark('membership-checked',f.db);\n  const totalBytes = Number(");
          replace('      const after = intakeWorkCounters(f.db).warm;',"      mark('warm-complete',f.db);\n      const after = intakeWorkCounters(f.db).warm;");
          // Reversing every observation must recover every original byte.
          let recovered=text;for(const {from,to} of [...changes].reverse()){assert.equal(recovered.split(to).length,2);recovered=recovered.replace(to,from);}assert.equal(recovered,original);
          text=text.replace(/from '([^']+)'/g,(match,specifier)=>specifier.startsWith('.')?`from '${pathToFileURL(resolve(dirname(originalPath),specifier)).href}'`:match);
          const hash=value=>createHash('sha256').update(value).digest('hex');
          writeFileSync(`${process.env.OUTPUT}/original-test.ts`,original);
          writeFileSync(`${process.env.OUTPUT}/phase-only.test.ts`,text);
          writeFileSync(`${process.env.OUTPUT}/derivative.json`,JSON.stringify({source:'9a4b2e0f6effac08fce454b246a808f03355eed1',originalPath,originalSha256:hash(original),derivativeSha256:hash(text),changes,scope:'Only phase observations and equivalent absolute imports. Original constants, assertions and 450000 ms case guard retained. Not a profiled run.'},null,2));
          NODE
      - name: Execute the unchanged full scenario with phase observations
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {openSync,closeSync,writeFileSync} from 'node:fs';
          import {testEnvironment} from './src/scripts/test-suite.ts';
          const args=['--test','--test-concurrency=1','--test-reporter=spec',`${process.env.OUTPUT}/phase-only.test.ts`];
          const fd=openSync(`${process.env.OUTPUT}/phase.log`,'w'),started=new Date().toISOString();
          const result=spawnSync(process.execPath,args,{env:testEnvironment(process.env,'server'),stdio:['ignore',fd,fd]});closeSync(fd);
          writeFileSync(`${process.env.OUTPUT}/result.json`,JSON.stringify({args,node:process.version,started,finished:new Date().toISOString(),status:result.status,signal:result.signal,error:result.error?.message??null},null,2));process.exitCode=result.status??1;
          NODE
      - name: Verify original source unchanged and retain hashes
        if: always()
        run: |
          git diff --exit-code
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3c-artifact-phases
          path: /tmp/pr71-step3c-artifact-phases
          if-no-files-found: error
          retention-days: 14
