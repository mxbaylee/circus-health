name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      OUTPUT: /tmp/pr71-step3-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6091456889e59ea77757f30c81fe0c3f879c7abb
          persist-credentials: false
          fetch-depth: 1
      - name: Retain existing complete CI logs without executing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT/logs"
          test "$(git rev-parse HEAD)" = 6091456889e59ea77757f30c81fe0c3f879c7abb
          git cat-file -p HEAD > "$OUTPUT/source-commit.txt"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUTPUT/source-tree-sha.txt"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const api='https://api.github.com/repos/mxbaylee/circus-health';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          async function get(path,file,json=true){
            const response=await fetch(api+path,{headers,signal:AbortSignal.timeout(30000)});
            const text=await response.text();
            writeFileSync(`${process.env.OUTPUT}/${file}`,text);
            if(!response.ok)throw Error(`${path}: HTTP ${response.status}`);
            return json?JSON.parse(text):text;
          }
          const run=await get('/actions/runs/37720471221','run.json');
          if(run.status!=='completed'||run.head_sha!=='6091456889e59ea77757f30c81fe0c3f879c7abb')throw Error('Run is not the completed candidate');
          const inventory=await get('/actions/runs/37720471221/jobs?per_page=100','jobs.json');
          if(inventory.total_count!==inventory.jobs.length)throw Error('Incomplete job inventory');
          await get('/pulls/71','pr.json');
          await get('/issues/comments/6051256915','bounded-review-request.json');
          await get('/issues/comments/6051280549','bounded-review-result.json');
          const summaries=[];
          for(const job of inventory.jobs){
            if(job.conclusion==='success'&&!['acceptance','continuation','Browser (5/6)'].includes(job.name))continue;
            if(job.status!=='completed')throw Error(`Unexpected incomplete job ${job.id}`);
            const text=await get(`/actions/jobs/${job.id}/logs`,`logs/${job.id}.log`,false);
            const lines=text.split('\n');
            const index=lines.findIndex(line=>line.includes('failing tests:'));
            summaries.push({id:job.id,name:job.name,conclusion:job.conclusion,started_at:job.started_at,completed_at:job.completed_at,logSha256:createHash('sha256').update(text).digest('hex'),summary:lines.filter(line=>/ℹ (tests|pass|fail|cancelled|skipped|duration_ms)\b|##\[error\]/u.test(line)),failureExcerpt:index<0?[]:lines.slice(index,index+90)});
          }
          const counts={};for(const job of inventory.jobs)counts[job.conclusion]=(counts[job.conclusion]??0)+1;
          writeFileSync(`${process.env.OUTPUT}/summary.json`,JSON.stringify({source:run.head_sha,runId:run.id,runAttempt:run.run_attempt,status:run.status,conclusion:run.conclusion,counts,jobs:summaries},null,2));
          console.log(JSON.stringify({runId:run.id,status:run.status,conclusion:run.conclusion,counts},null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-step3-final-ci
          path: /tmp/pr71-step3-ci
          if-no-files-found: error
          retention-days: 14
