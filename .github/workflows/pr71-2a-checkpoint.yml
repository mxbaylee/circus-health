name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6091456889e59ea77757f30c81fe0c3f879c7abb
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve checksum-verified source tree without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { inflateSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const encoded = '';
          const patch = inflateSync(Buffer.from(encoded, 'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'), 'f24f5a43663b97b5c1a3a5f29e7d1d14738ce3a1fe28907b9b187155075f7630');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'), '6091456889e59ea77757f30c81fe0c3f879c7abb');
          writeFileSync('/tmp/step3.patch', patch);
          git('apply','--check','/tmp/step3.patch');
          git('apply','/tmp/step3.patch');
          git('add','-A');
          const tree = git('write-tree');
          assert.equal(tree, '66daf07de8386bf45fc539bfa526c0db90e2c8e6');
          const paths = git('diff','--cached','--name-only').split('\n');
          assert.equal(paths.length, 6);
          const response = await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/trees', {
            method:'POST', headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({base_tree:'be1e57f3544eee63316b61036b378d9041927183',tree:paths.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))}),
            signal:AbortSignal.timeout(60000)
          });
          const result = await response.json();
          assert.ok(response.ok, JSON.stringify(result));
          assert.equal(result.sha,tree);
          console.log(JSON.stringify({preservedTree:tree,sourceCandidate:'7ea383e54bd3d21849aaba2c6f413ef1605c356d',parent:'6091456889e59ea77757f30c81fe0c3f879c7abb',paths,refsChanged:false},null,2));
          NODE
