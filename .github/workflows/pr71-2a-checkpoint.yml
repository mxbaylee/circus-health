name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-history-lane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 25a86bb9c3ddb5516747561df56d879b08727077
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assemble the checked required-history lane
        run: |
          mkdir -p "$OUTPUT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {inflateSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const encoded='';
          const patch=inflateSync(Buffer.from(encoded,'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'01c1557e4b8c5907b96a8b6f960ea4b5f9c837876376d46b4103873fbba2838c');
          const file=`${process.env.OUTPUT}/repair.patch`;writeFileSync(file,patch);
          execFileSync('git',['apply','--check',file]);execFileSync('git',['apply',file]);execFileSync('git',['add','-A']);
          assert.equal(execFileSync('git',['write-tree'],{encoding:'utf8'}).trim(),'e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e');
          NODE
          npm ci > "$OUTPUT/npm-ci.log" 2>&1
      - name: Verify suite coverage, environment isolation and static checks
        run: |
          node --test src/scripts/test-suite.test.ts > "$OUTPUT/partition.log" 2>&1
          npm run typecheck > "$OUTPUT/typecheck.log" 2>&1
          node node_modules/prettier/bin/prettier.cjs --check src/scripts/test-suite.ts src/scripts/test-suite.test.ts package.json > "$OUTPUT/format.log" 2>&1
          node scripts/repository-file-inventory.ts --check > "$OUTPUT/inventory.log" 2>&1
          git diff --cached --check
          git diff --exit-code
          git diff --cached --exit-code -- src/server/test/intake-identity-native-artifact-history.test.ts src/server/test/intake-identity-native-receipt-history.test.ts
      - name: Preserve exact source before normal required CI execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e | gzip -n > "$OUTPUT/source.tar.gz"
          git ls-tree -r e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e > "$OUTPUT/source-tree.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const tree='e9b52942e7ecbe2f5eecd8b5e7339ab5e5effb2e';
          const paths=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');assert.equal(paths.length,6);
          const response=await fetch('https://api.github.com/repos/mxbaylee/circus-health/git/trees',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({base_tree:'ef05a5e4330aa36aea9860d548b5919d457241d8',tree:paths.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))}),signal:AbortSignal.timeout(60000)
          });
          const result=await response.json();assert.ok(response.ok,JSON.stringify(result));assert.equal(result.sha,tree);
          writeFileSync(`${process.env.OUTPUT}/preserved.json`,JSON.stringify({base:'25a86bb9c3ddb5516747561df56d879b08727077',tree,paths,refsChanged:false,node:process.version},null,2));
          NODE
      - name: Hash retained output
        if: always()
        run: |
          if [ -d "$OUTPUT" ]; then
            cd "$OUTPUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-history-lane-verified
          path: /tmp/pr71-history-lane
          if-no-files-found: error
          retention-days: 14
