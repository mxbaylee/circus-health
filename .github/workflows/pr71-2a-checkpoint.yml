name: PR 71 bounded workspace

on:
  push:
    branches: [codex/pr71-step0-workspace]
    paths: [.github/workflows/pr71-2a-checkpoint.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
      OUTPUT: /tmp/pr71-wal32-cycles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98858d6e44bdf8771e01de79f08407a98fa4080d
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Classify prior commit reset correlations including final drain
        env:
          CRS_IDENTITY_GROUNDING_DIAGNOSTIC: '1'
          CRS_IDENTITY_GROUNDING_DIAGNOSTIC_EXTENDED: '1'
        run: |
          mkdir -p "$OUTPUT"
          git rev-parse HEAD > "$OUTPUT/source-sha.txt"
          node --test --test-name-pattern='native identity grounding phase counts: 32 new artifacts' src/server/test/intake-history-publication.test.ts 2>&1 | tee "$OUTPUT/wal-cycles.log"
      - name: Hash diagnostic evidence
        if: always()
        run: |
          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr71-wal32-cycles
          path: /tmp/pr71-wal32-cycles
          if-no-files-found: error
          retention-days: 14
