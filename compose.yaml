services:
  health:
    build:
      context: .
      args:
        CRS_BUILD_REVISION: ${CRS_BUILD_REVISION:-unknown}
        CRS_BUILD_WORKTREE: ${CRS_BUILD_WORKTREE:-unknown}
    image: ${CRS_IMAGE:?use npm run start}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    pids_limit: ${CRS_PIDS_LIMIT:-512}
    shm_size: 128m
    cpus: ${CRS_CPUS:-2}
    init: true
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      CRS_DATA_DIR: /archive/data
      CRS_RUNTIME_DIR: /run/health
      CRS_PUBLIC_PORT: ${CRS_PORT:-3001}
      CRS_PUBLIC_ORIGIN: ${CRS_PUBLIC_ORIGIN:-http://localhost:${CRS_PORT:-3001}}
      CRS_AI_BACKEND: litellm
      CRS_AI_MODEL: ${CRS_MODEL:?use npm run start with CRS_MODEL}
      CRS_AI_BASE_URL: http://litellm:4000
      CRS_AI_API_KEY_FILE: /run/secrets/litellm_master_key
      CRS_AI_PROXY_RESOLVED_MODEL: ${CRS_RESPONSE_MODEL:?use npm run start}
      CRS_AI_PROXY_IMAGES: ${CRS_IMAGES:-false}
      CRS_AI_PROXY_PDF: ${CRS_PDF:-auto}
      CRS_AI_PROXY_PROMPT_CACHE: ${CRS_PROMPT_CACHE:-false}
      CRS_AI_PROXY_TIMEOUT_SECONDS: ${CRS_AI_PROXY_TIMEOUT_SECONDS:-300}
      CRS_INTAKE_UPLOAD_MIB: ${CRS_INTAKE_UPLOAD_MIB:-128}
      CRS_INTAKE_EXTRACTION_MIB: ${CRS_INTAKE_EXTRACTION_MIB:-64}
      CRS_IMPORT_DIAGNOSTICS: ${CRS_IMPORT_DIAGNOSTICS:-false}
    ports:
      - '127.0.0.1:${CRS_PORT:-3001}:3001'
    volumes:
      - type: bind
        source: ${CRS_DATA_DIR:?use npm run start with CRS_DATA_DIR}
        target: /archive/data
        bind:
          create_host_path: false
    secrets:
      - litellm_master_key
    tmpfs:
      - /run/health:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=0700,size=${CRS_RUNTIME_TMPFS_MIB:-1024}m
      - /tmp:rw,nosuid,nodev,noexec,size=${CRS_TMP_TMPFS_MIB:-128}m
    networks:
      - proxy
      - browser
    logging:
      driver: none
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  litellm:
    build:
      context: ./deploy/litellm
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    pids_limit: ${CRS_LITELLM_PIDS_LIMIT:-256}
    cpus: ${CRS_LITELLM_CPUS:-1}
    entrypoint: ['/bin/sh', '/opt/circus/entrypoint.sh']
    env_file:
      - path: ${CRS_LITELLM_ENV_FILE:?use npm run start}
        format: raw
    environment:
      CRS_MODEL: ${CRS_MODEL:?use npm run start with CRS_MODEL}
      CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt
      CHATGPT_AUTH_FILE: auth.json
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_LOG: ERROR
      LITELLM_MODE: PRODUCTION
    volumes:
      - type: bind
        source: ${CRS_LITELLM_CONFIG:?use npm run start with CRS_LITELLM_CONFIG}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/litellm/entrypoint.sh
        target: /opt/circus/entrypoint.sh
        read_only: true
      - type: bind
        source: ./deploy/litellm/configure.py
        target: /opt/circus/configure.py
        read_only: true
      - type: bind
        source: ./deploy/litellm/response_diagnostics.py
        target: /tmp/response_diagnostics.py
        read_only: true
      - type: bind
        source: ${CRS_AUTH_DIR:?use npm run start}
        target: /var/lib/litellm/chatgpt
        bind:
          create_host_path: false
    secrets:
      - litellm_master_key
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=${CRS_TMP_TMPFS_MIB:-128}m
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy
      - provider
    logging:
      driver: none
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 3

secrets:
  litellm_master_key:
    file: ${CRS_PROXY_KEY:?use npm run start}

networks:
  proxy:
    internal: true
  # Docker does not publish ports on a container attached only to internal
  # networks. This bridge makes the loopback browser binding reachable.
  browser: {}
  provider: {}
